[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ModelistsGCN"
version = "0.1.0"
description = "ModelistsGCN: semi-supervised graph clustering for spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Noa Konforti"}]
license = {text = "MIT"}

dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "torch",
  "torch-geometric",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
